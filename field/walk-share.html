<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Site walk</title>
    <link rel="icon" href="/public/favicon.svg" />
    <link rel="stylesheet" href="/public/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/field/styles.css" />
    <style>
      /* The recipient page has no app shell: it is the map, a header and the numbered list. */
      :root {
        --surface: #ffffff;
        --surface-alt: #eef7ef;
        --border: #d7e4d8;
        --text: #1c2520;
        --text-muted: #5b6b62;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #17231c;
          --surface-alt: #203126;
          --border: #2f4236;
          --text: #eef3ef;
          --text-muted: #a7b6ac;
        }
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--surface);
        color: var(--text);
        font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .share-app {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
      }
      .share-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        padding-top: max(10px, env(safe-area-inset-top));
        background: #0f5f9a;
        color: #fff;
      }
      .share-header img {
        height: 24px;
      }
      .share-header-title {
        flex: 1;
        min-width: 0;
        line-height: 1.2;
      }
      .share-header-title strong {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .share-header-title small {
        opacity: 0.85;
      }
      .share-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 0.8rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .share-status i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7fbe3f;
      }
      .share-status.is-done i {
        background: #c9d3cc;
      }
      .share-map {
        position: relative;
        height: min(62dvh, 560px);
        min-height: 320px;
      }
      .share-body {
        padding: 12px 16px 32px;
        padding-bottom: max(32px, env(safe-area-inset-bottom));
      }
      .share-empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--text-muted);
      }
      .share-summary {
        margin: 0 0 12px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface-alt);
        white-space: pre-wrap;
      }
      .share-fineprint {
        margin: 12px 0 0;
        font-size: 0.75rem;
        color: var(--text-muted);
      }
      .share-lightbox {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.9);
      }
      .share-lightbox[hidden] {
        display: none;
      }
      .share-lightbox img {
        max-width: 100vw;
        max-height: 88dvh;
        object-fit: contain;
      }
      .share-lightbox figcaption {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        color: #fff;
        text-align: center;
        font-size: 0.9rem;
      }
      .share-lightbox button {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        right: 12px;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 1.4rem;
      }
    </style>
  </head>
  <body>
    <div class="share-app">
      <header class="share-header">
        <img src="/public/brand/bioremedy-logo-primary-reversed.png" alt="BioRemedy" />
        <div class="share-header-title"><strong id="shareTitle">Site walk</strong><small id="shareSubtitle">Loading…</small></div>
        <span class="share-status" id="shareStatus"><i></i><span>Loading</span></span>
      </header>
      <div class="share-map" id="shareMap"></div>
      <main class="share-body" id="shareBody"><div class="share-empty">Loading the walk…</div></main>
    </div>
    <figure class="share-lightbox" id="shareLightbox" hidden>
      <button type="button" aria-label="Close">×</button>
      <img alt="" />
      <figcaption></figcaption>
    </figure>
    <script src="/public/vendor/leaflet/leaflet.js"></script>
    <script type="module" src="/field/walk-share.js"></script>
  </body>
</html>
